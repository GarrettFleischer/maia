# Bun configuration (https://bun.sh/docs/runtime/bunfig)
# Coverage reports go to coverage/ (gitignored). Use "bun run test:coverage".
# We enforce ≥90% line/function coverage on testable src, excluding CLI/server
# entry points and network/LLM-only code (channels, watchdog daemon, hooks).

[test]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
# 90% overall enforced by scripts/check-coverage.ts (Bun threshold is per-file)
# Exclude entry points and network/LLM-only code
coveragePathIgnorePatterns = [
  "src/index.ts",
  "src/gateway/bun-server.ts",
  "src/gateway/ws-handler.ts",
  "src/app.ts",
  "src/agents/orchestrator.ts",
  "src/agents/tools.ts",
  "src/threads/service.ts",
  "src/channels/base.ts",
  "src/channels/cli.ts",
  "src/channels/webchat.ts",
  "src/channels/discord.ts",
  "src/channels/telegram.ts",
  "src/channels/index.ts",
  "src/watchdog/daemon.ts",
  "src/watchdog/monitor.ts",
  "src/watchdog/shutdown.ts",
  "src/watchdog/index.ts",
  "src/hooks/runner.ts",
  "src/hooks/types.ts",
  "src/agent/tools/base.ts",
  "tests/helpers/**",
]
