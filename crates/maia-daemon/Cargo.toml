[package]
name = "maia-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22"
dotenvy = "0.15.7"
getrandom = "0.2"
maia-containment = { workspace = true }
maia-core = { workspace = true }
maia-embedder = { workspace = true }
maia-router = { workspace = true }
maia-secrets = { workspace = true }
maia-store = { workspace = true }
maia-tools = { workspace = true }
maia-vault = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
tower-http = { version = "0.6.11", features = ["fs"] }

[dev-dependencies]
dotenvy = "0.15.7"
http = "1"
futures-util = { workspace = true }
maia-core = { workspace = true }
maia-router = { workspace = true }
tokio-tungstenite = "0.29.0"

[target.'cfg(windows)'.dependencies]
maia-windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
maia-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
maia-macos = { workspace = true }

[lints]
workspace = true
